<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CMS Login — Resources Technologies Systems Limited</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --card-bg: #0e0e0e;
      --card-border: rgba(255, 255, 255, 0.12);
      --input-bg: #151515;
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: rgba(255, 255, 255, 0.38);
      --text: #ffffff;
      --text-muted: #8e8e8e;
      --accent: #ffffff;
      --danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --font-sans: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle background ambient mesh glow */
    .bg-mesh {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Login Card */
    .login-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 40px 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 24px;
      animation: cardFadeIn 300ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Brand Header */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .login-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #111111;
      padding: 4px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Alert Banner */
    .alert-error {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      align-items: center;
      gap: 10px;
      animation: shake 250ms ease-in-out;
    }

    .alert-error.is-visible {
      display: flex;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }

    /* Form Fields */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #dedede;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 140ms ease-out, background 140ms ease-out;
    }

    .form-input:focus {
      border-color: var(--input-focus);
      background: #181818;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 140ms ease-out;
    }

    .password-toggle:hover {
      color: #ffffff;
    }

    /* Options Row */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input {
      accent-color: #ffffff;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: #ffffff;
      color: #040404;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      padding: 13px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 140ms ease-out, transform 140ms ease-out;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: #e6e6e6;
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Footer Back Link */
    .login-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .login-back-link {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 140ms ease-out;
    }

    .login-back-link:hover {
      color: #ffffff;
    }

    /* Helper info badge */
    .cred-hint {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12px;
      color: #999999;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cred-hint strong {
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-mesh" aria-hidden="true"></div>

  <div class="login-card">
    <!-- Brand Header -->
    <div class="login-brand">
      <img src="assets/logo.png" alt="Resources Tech Logo" class="login-logo" />
      <h1 class="login-title">CMS Admin Portal</h1>
      <p class="login-subtitle">Resources Technologies Systems Limited</p>
    </div>

    <!-- Error Alert Banner -->
    <div class="alert-error" id="alertError" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="errorMessage">Invalid username or password. Please try again.</span>
    </div>

    <!-- Form -->
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="form-input" placeholder="admin" required autofocus autocomplete="username" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password" />
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe" checked />
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Authenticate &amp; Enter CMS</span>
      </button>

      <!-- Credentials Helper Card -->
      <div class="cred-hint">
        <div>Username: <strong>admin</strong></div>
        <div>Password: <strong>ResourcesTech2026!</strong></div>
      </div>
    </form>

    <div class="login-footer">
      <a href="./projects.html" class="login-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Return to Public Website</span>
      </a>
    </div>
  </div>

  <script>
    // Expected SHA-256 hash for ResourcesTech2026! with salt
    const AUTH_SALT = 'resources_tech_salt_2026';
    const VALID_USER = 'admin';
    const VALID_PASS_HASH = '765c4b8b4add35c31d8a8ced757868c23eabfbe55c4726a14d29702b05ec0474';

    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');
    const alertError = document.getElementById('alertError');
    const btnSubmit = document.getElementById('btnSubmit');

    // Toggle password visibility
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.style.display = isPassword ? 'none' : 'block';
      eyeOffIcon.style.display = isPassword ? 'block' : 'none';
    });

    // Hash helper
    async function computeHash(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password + AUTH_SALT);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Handle login submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertError.classList.remove('is-visible');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Verifying credentials...';

      const user = usernameInput.value.trim();
      const pass = passwordInput.value;
      const remember = document.getElementById('rememberMe').checked;

      // 1. Try server API login first (if backend running)
      let authenticated = false;
      try {
        const apiRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        if (apiRes.ok) {
          authenticated = true;
        }
      } catch (err) {
        // server not reachable or running on static Vercel host
      }

      // 2. Client-side cryptographically secure fallback (works anywhere on Vercel/CDN)
      if (!authenticated) {
        const hash = await computeHash(pass);
        if (user.toLowerCase() === VALID_USER && hash === VALID_PASS_HASH) {
          authenticated = true;
        }
      }

      if (authenticated) {
        // Generate session token
        const token = `rt_auth_${Date.now()}_${Math.random().toString(36).substring(2)}`;
        const storage = remember ? localStorage : sessionStorage;
        storage.setItem('rt_cms_auth_token', token);
        storage.setItem('rt_cms_user', user);

        // Redirect to admin
        const params = new URLSearchParams(window.location.search);
        const destination = params.get('redirect') || 'admin.html';
        window.location.href = destination;
      } else {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Authenticate & Enter CMS';
        alertError.classList.add('is-visible');
        passwordInput.value = '';
        passwordInput.focus();
      }
    });
  </script>
</body>
</html>
